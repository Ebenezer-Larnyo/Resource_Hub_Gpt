name: Validate resource hub
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate JSON files
        run: |
          python -m json.tool data/resources.json >/dev/null
          python -m json.tool crawler/sources.json >/dev/null
          python -m json.tool crawler/review_queue.json >/dev/null
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
